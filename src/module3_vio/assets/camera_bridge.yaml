# ROS2-Gazebo Bridge Configuration for x500_skydio_0
# 6 cameras: front, right, back, left, up, down
# Each camera has: image + camera_info

# ============== CAMERA FRONT ==============
- topic_name: "/world/default/model/x500_skydio_0/model/camera_front/link/camera_link/sensor/IMX214/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- topic_name: "/world/default/model/x500_skydio_0/model/camera_front/link/camera_link/sensor/IMX214/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

